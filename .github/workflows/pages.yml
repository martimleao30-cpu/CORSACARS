name: Publicar CORSACARS Online

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: corsacars-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter ficheiros do jogo
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar ficheiros para publicação
        run: |
          mkdir -p _site
          cp -r index.html src CREDITS.md _site/
          touch _site/.nojekyll
      - name: Enviar ficheiros para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
