name: CORSACARS - Aplicacao Windows EXE
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "desktop/**"
      - "vite.desktop.config.mjs"
      - "electron-builder.yml"
      - "package.json"
      - "tests/desktop-build.mjs"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-exe:
    name: Compilar jogo Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar e testar jogo desktop
        run: |
          npm run desktop:build
          npm run test:desktop
      - name: Criar executavel portatil Windows
        run: npm run desktop:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Disponibilizar .exe
        uses: actions/upload-artifact@v4
        with:
          name: CORSACARS-Windows-EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
