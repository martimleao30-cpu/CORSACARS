name: CORSACARS - Windows com atualizacoes automaticas
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "desktop/**"
      - "vite.desktop.config.mjs"
      - "electron-builder.yml"
      - "package.json"
      - "tests/desktop-build.mjs"
      - "tests/updates.mjs"
      - "tests/road-signage.mjs"
      - "tests/road-environments.mjs"
      - ".github/workflows/windows-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corsacars-desktop-release
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Gerar instalador e publicar atualizacao
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerar versao unica para cada atualizacao
        shell: pwsh
        run: |
          npm version "0.7.${{ github.run_number }}" --no-git-tag-version
          Write-Host "A publicar CORSACARS 0.7.${{ github.run_number }}"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Testar o updater, fisica e navegacao
        run: npm test
      - name: Compilar o jogo Windows, verificando ficheiros locais
        run: |
          npm run desktop:build
          npm run test:desktop
      - name: Criar instalador e publicar GitHub Release com latest.yml
        run: npm run desktop:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Guardar copia do instalador nos artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CORSACARS-Windows-Installer
          path: release/*Setup*.exe
          if-no-files-found: error
          retention-days: 30
